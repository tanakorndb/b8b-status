[build]
  publish = "."
  command = "node build.js"

[[headers]]
  for = "/status.json"
  [headers.values]
    Cache-Control = "public, max-age=30, s-maxage=30"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
