name: Sync System Status (Manual Only)

on:
  workflow_dispatch:

jobs:
  sync-status:
    runs-on: [self-hosted, mac-owner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update status.json
        run: |
          node scripts/update-status.js || true

      - name: Commit and push changes
        run: |
          git config user.name "b8b-status-bot"
          git config user.email "bot@b8b.group"
          if [ -n "$(git status --porcelain status.json)" ]; then
            git add status.json
            git commit -m "chore(status): manual sync infrastructure state [skip ci]"
            git push origin main
          else
            echo "No status changes detected."
          fi
