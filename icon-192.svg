<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Outer Glow Pulse Ring -->
  <circle cx="96" cy="96" r="62" fill="none" stroke="url(#ring)" stroke-width="6" filter="url(#glow)" opacity="0.85"/>
  <circle cx="96" cy="96" r="62" fill="none" stroke="url(#ring)" stroke-width="5"/>
  
  <!-- Center Signal Dot -->
  <circle cx="96" cy="96" r="28" fill="#10b981" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="28" fill="#10b981"/>
  
  <!-- Core Inner White Highlight -->
  <circle cx="90" cy="90" r="8" fill="#ffffff" opacity="0.6"/>
</svg>
